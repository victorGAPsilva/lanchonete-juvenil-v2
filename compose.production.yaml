name: lanchonete-juvenil-production
services:
  juvenil:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: https://${DOMAIN:?Defina DOMAIN no arquivo .env.production}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: 1
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
    volumes:
      - juvenil-data:/app/data
      - juvenil-uploads:/app/uploads
      - juvenil-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      juvenil:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  juvenil-data:
  juvenil-uploads:
  juvenil-backups:
  caddy-data:
  caddy-config:
